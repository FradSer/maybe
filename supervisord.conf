; Single-container supervisor config for Maybe (rails + sidekiq + postgres + redis).
; Installed at /etc/supervisor/supervisord.conf, replacing Debian's default
; (which assumes root: socket in /var/run/supervisor.sock).
; Everything runs as uid 1000 (the container's USER) — supervisor does no setuid.

[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:postgres]
; Direct binary (not pg_ctl — pg_ctl daemonizes and supervisor would lose the child).
; -k /tmp: the default socket dir /var/run/postgresql is root-owned, uid 1000 would crash.
command=/usr/lib/postgresql/15/bin/postgres -D /data/postgres -k /tmp
directory=/data/postgres
autorestart=true
startretries=10
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
; Never pass /etc/redis/redis.conf — it sets daemonize yes. Built-in default is no.
command=redis-server --bind 127.0.0.1 --port 6379 --dir /data/redis --daemonize no
directory=/data/redis
autorestart=true
startretries=10
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rails]
; Wait for postgres (bounded: a dead postgres surfaces as FATAL after startretries),
; then db:prepare (no-op when schema_migrations is current) and exec the server so
; supervisor's SIGTERM reaches puma directly.
command=/bin/bash -c 'for i in $(seq 1 90); do /usr/bin/pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break; [ "$i" -eq 90 ] && exit 1; sleep 1; done; ./bin/rails db:prepare && exec ./bin/rails server'
directory=/rails
autorestart=true
startretries=10
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sidekiq]
command=/bin/bash -c 'for i in $(seq 1 90); do /usr/bin/pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break; [ "$i" -eq 90 ] && exit 1; sleep 1; done; exec bundle exec sidekiq'
directory=/rails
autorestart=true
startretries=10
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
